{% put head %}
    {{ vite(['assets/src/js/winter-altcha.js'], 'winter.altcha' ) }}
{% endput %}

<altcha-widget
	auto="off"
	challenge="{{ __SELF__.challengeUrl }}"
	configuration='{"delay": 500}'
	display="{{ __SELF__.displayMode }}"
{% if __SELF__.language != 'detect' %}
	language="{{ __SELF__.language }}"
{% endif %}
	name="{{ __SELF__.fieldName }}"
	theme="{{ __SELF__.theme }}"
	type="{{ __SELF__.type }}"
	workers="4"
></altcha-widget>
